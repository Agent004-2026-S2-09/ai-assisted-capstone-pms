[server]
maxUploadSize = 25
address = "0.0.0.0"
port = 8501
headless = true
# Cloud runs are restarted when the deployed revision changes. Disabling the
# development watcher avoids evicting app_modules from sys.modules while a
# rerun is importing the application.
fileWatcherType = "none"

[theme]
base = "light"
font = "sans-serif"
primaryColor = "#2FC8FF"
backgroundColor = "#F4F4F4"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#001B2F"
borderColor = "#96E3FF"
baseRadius = "14px"
buttonRadius = "12px"
headingFontSizes = ["2.15rem", "1.65rem", "1.25rem"]
headingFontWeights = [700, 700, 650]
linkUnderline = false
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#001B2F"
secondaryBackgroundColor = "#005B85"
textColor = "#F8FAFC"
primaryColor = "#2FC8FF"
borderColor = "#2FC8FF"
